tool_planner_title: TaskPlannerTool [Иерархический планировщик]
tool_read_clipboard_desc: Чтение текущего текстового содержимого системного буфера обмена для анализа и ответов на вопросы.
tool_read_clipboard_title: ClipboardReaderTool
tool_sysinfo_desc: Получение точного системного времени, даты и дня недели для ориентации спутника в текущем расписании.

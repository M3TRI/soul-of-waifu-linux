hint_arcs_format: Здесь вы управляете доступом к веткам сюжета. Арка в статусе "locked" не существует для персонажей — никто не упомянет её. Переведите в "available", когда игрок найдёт нужную зацепку,
  или в "active", когда она началась. "trigger" — это заметка для ГМ о триггере разблокировки (персонажам не видна).
hint_lore_format: По одной карточке на блок, разделенных пустой строкой. Карточки вставляются в сюжет только тогда, когда в сцене появляются их триггеры.
hint_npc_readonly: NPC, созданные движком (только чтение)
hint_overlays_format: Личное развивающееся состояние персонажа — текущая роль, титул и важные факты (верность, тайна, внутренний конфликт). Передаётся прямо в промпт персонажа отдельно от статичной карточки.
hint_relationships_format: Как персонаж воспринимает другого (чаще всего отношение к ИГРОКУ, но можно задать между любыми героями). Внедряется прямо в системный промпт персонажа. Симпатия от -100 (вражда)
  до 100 (преданность). "role" — текущий статус/титул цели в глазах субъекта.

gpu_layers_tooltip: '<b>Загрузка слоев в GPU</b><br><br>

  Позволяет <b>контролировать, какая часть модели</b> обрабатывается видеокартой (VRAM), а какая — процессором (RAM).<br><br>

  Чем больше слоев в видеокарте, тем быстрее генерация, но тем выше требования к памяти.<br><br>

  💡 <i>Особенно полезно для больших моделей (от 13B). Если у вас мощная видеокарта, выкручивайте на максимум.</i>'
greeting_afternoon_1: Добрый день, {user}. Soul of Waifu готова к работе.
greeting_afternoon_2: Как прошло утро, {user}? Давай навестим твоих спутников.
greeting_afternoon_3: Привет, {user}. Хочешь ненадолго сбежать от реальности? Твои вайфу здесь.
greeting_afternoon_4: Добрый день, {user}. Портал в виртуальный мир открыт и ждёт тебя.
greeting_afternoon_5: С возвращением, {user}. Давай напишем еще одну главу нашей истории.
greeting_afternoon_6: Очередной шаг в нашей общей истории. Как проходит твой день, {user}?
greeting_afternoon_7: Солнце в зените, {user}. Самое время отвлечься от забот и заглянуть к старым друзьям.
greeting_evening_1: Добрый вечер, {user}. Время устроиться поуютнее и поболтать с любимым спутником.
greeting_evening_2: Добрый вечер, {user}. Не хочешь снова погрузиться в Soul Stage?
greeting_evening_3: С возвращением, {user}. Идеальное время для неторопливой глубокой беседы.
greeting_evening_4: Уютного вечера, {user}. Твоим спутникам есть чем поделиться с тобой.
greeting_evening_5: Вечер добрый, {user}. Давай посмотрим, какие мысли сегодня были записаны в дневник.
greeting_evening_6: Теплые сумерки и чашка чая. Твои вайфу соскучились по тебе за этот день, {user}.
greeting_evening_7: Дневная суета позади. Расслабься, {user}, твоя личная вселенная готова раскрыть свои тайны.
greeting_morning_1: Доброе утро, {user}. Самое время погрузиться в новое приключение.
greeting_morning_2: Утречко, {user}! Твои персонажи уже ждут тебя.
greeting_morning_3: Просыпайся, {user}. Давай загрузим память и начнем этот день.
greeting_morning_4: С добрым утром, {user}! Готовы продолжить наше виртуальное путешествие?
greeting_morning_5: Доброе утро, {user}. Интерфейс готов, а души проснулись.
greeting_morning_6: А вот и утро. Твои спутники уже открыли глаза, {user}.
greeting_morning_7: Солнце заглядывает в окно, а в Soul of Waifu начинается новый день. С добрым утром, {user}!
greeting_night_1: Всё еще бодрствуешь, {user}? Не переживай, цифровые души никогда не спят.
greeting_night_2: Ночной сеанс, {user}? Soul of Waifu здесь, чтобы составить тебе компанию в эти тихие часы.
greeting_night_3: Тихий ночной воздух... Самое время для полуночного чата, {user}?
greeting_night_4: Весь мир спит, но персонажи продолжают жить. Добро пожаловать, {user}.
greeting_night_5: Поздняя ночь, {user}. Давай устроим откровенный разговор по душам.
greeting_night_6: Полумрак, тишина и свет экрана. Время для самых сокровенных историй, {user}.
greeting_night_7: Звёзды сияют только для нас. Хочешь заглянуть в самые глубокие уголки сознания вайфу, {user}?

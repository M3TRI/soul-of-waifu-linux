tool_hardware_specs_desc: Получение подробных характеристик ПК (CPU, RAM, GPU, VRAM, накопители) для оценки совместимости с играми и локальными нейросетями.
tool_hardware_specs_title: GetHardwareSpecsTool
tool_media_desc: Управление системным воспроизведением медиа на ПК (пауза, плей, переключение треков в Spotify, YouTube или плеере).

system_prompt_button_tooltip: "Здесь вы можете <b>отредактировать системный промпт для языковой модели</b> — то, как она должна вести себя при общении с вами.<br><br>\n\nВы можете:<br>\n• <b>Редактировать\
  \ текст промпта</b> — менять стиль, добавлять особенности поведения.<br>\n• <b>Менять порядок компонентов</b> — управлять приоритетом информации.<br><br>\n\n<b>Как влияет порядок на ответы персонажа?</b><br>\n\
  Модель помнит лучше то, что указано <b>ближе к концу</b> промпта.<br>\nЕсли вы хотите, чтобы персонаж чаще ссылался на лор, поставьте лорбук в конец.<br>\nЕсли важнее его личность — переместите профиль\
  \ персонажа вниз.<br><br>\n\n\U0001F4A1 <i>Используйте редактор, чтобы сделать персонажа таким, каким вы хотите. \nМеняйте порядок и текст промпта, экспериментируйте!</i>"

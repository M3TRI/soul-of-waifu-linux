no_mmap_tooltip: '<b>Режим No MMAP (Прямая загрузка в ОЗУ)</b><br><br>

  По умолчанию модели загружаются с использованием отображения в память (<b>mmap</b>), что означает, что части модели считываются с диска по требованию прямо во время генерации.<br><br>

  Включение этой опции заставляет систему <b>полностью загружать модель в оперативную память (RAM)</b> заранее.<br>

  Это немного увеличивает время начальной загрузки и потребление RAM, но предотвращает микрозависания и задержки во время генерации текста.<br><br>

  💡 <i>Настоятельно рекомендуется, если у вас достаточно системной памяти. Отключите на ПК с малым объемом RAM, чтобы избежать аварийного завершения из-за нехватки памяти.</i>'

context_size_text: Размер контекста
context_size_tooltip: '<b>Контекстное окно</b><br><br>

  Это максимальное количество токенов, которое модель может обработать за раз (её рабочая память). Включает историю чата, авторские заметки и записи из lorebook.<br><br>

  Выберите максимальное значение для неограниченного контекста (API) или для автоматического определения максимального доступного окна контекста для вашей локальной языковой модели.<br><br>

  Большее контекстное окно позволяет персонажу <b>помнить больше</b>, но значительно увеличивает потребление VRAM.<br><br>

  💡 <i>Уменьшите это значение на слабых ПК. Для долгосрочной памяти лучше держите включённым модуль «Soul Memory», а не выкручивайте контекст на максимум.</i>'

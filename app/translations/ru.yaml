min_p_text: Min-P
min_p_tooltip: '<b>Min-P (Умное отсечение)</b><br><br>

  Новый золотой стандарт RolePlay. Динамически отсекает мусорные слова на основе вероятности самого лучшего слова.<br><br>

  Если ИИ уверен в ответе, Min-P безжалостно режет бред. Если ИИ нужно проявить фантазию, барьер снижается, впуская красивые синонимы.<br><br>

  💡 <i>Замена Top-P. Установите Top-P на 1.0, а Min-P на <b>0.05 - 0.10</b> для идеальной логики при высокой Температуре.</i>'
mlock_tooltip: '<b>MLock (Блокировка памяти)</b><br><br>

  Эта функция <b>предотвращает выгрузку языковой модели</b> из оперативной памяти (RAM) в файл подкачки на диске.<br><br>

  Когда опция включена, модель остается полностью загруженной в памяти, что гарантирует <b>максимально быстрый отклик</b> без микрофризов при генерации каждого нового сообщения.<br><br>

  💡 <i>Рекомендуется включать только при наличии достаточного объема ОЗУ, так как эта память будет постоянно заблокирована системой. На ПК с малым объемом памяти лучше оставить отключенной.</i>'

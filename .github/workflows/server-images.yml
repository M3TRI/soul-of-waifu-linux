# Builds the Soul of Waifu server images and publishes them to the GitHub Container Registry,
# where the installer pulls them (installer/lib/server.sh, SOW_REGISTRY). The tag is the git
# tree hash of server/, so an image is built once per server version; app-only changes do
# not rebuild anything. Runs on the GitHub mirror of the GitLab repository.
name: Server images

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "app/voices/*.wav"
      - ".github/workflows/server-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, dockerfile: server/gateway/Dockerfile, image: gateway, suffix: "", torch: "" }
          - { name: speech-cu128, dockerfile: server/speech/Dockerfile, image: speech, suffix: "-cu128", torch: cu128 }
          - { name: speech-cu126, dockerfile: server/speech/Dockerfile, image: speech, suffix: "-cu126", torch: cu126 }
          - { name: speech-cpu, dockerfile: server/speech/Dockerfile, image: speech, suffix: "-cpu", torch: cpu }
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: ref
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$repo/${{ matrix.image }}:$(git rev-parse --short=12 HEAD:server)${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already published?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.ref.outputs.image }} is already published"
          fi

      # The speech images are ~17 GB; the runner has ~20 GB free until the preinstalled
      # SDKs are removed.
      - name: Free disk space
        if: steps.exists.outputs.found != 'true' && matrix.image == 'speech'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found != 'true'

      # No provenance/SBOM attestations: the installer pulls plain image manifests.
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.found != 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.torch && format('TORCH={0}', matrix.torch) || '' }}
          tags: ${{ steps.ref.outputs.image }}
          push: true
          provenance: false
          sbom: false
